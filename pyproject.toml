[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "biokin-gillespie-stochastic-gene-network"
version = "0.1.0"
description = "Exact Gillespie Direct SSA, First-Reaction Method, and Adaptive Tau-Leaping Engine for Cellular Kinetics and Gene Regulatory Circuits"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Ayush Kandwal", email = "ayushkandwal2007@gmail.com" }
]
keywords = [
    "gillespie",
    "stochastic-simulation",
    "systems-biology",
    "gene-regulatory-networks",
    "synthetic-biology",
    "tau-leaping",
    "chemical-kinetics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "scipy>=1.10"]

[project.urls]
Homepage = "https://github.com/Sunzzx/biokin-gillespie-stochastic-gene-network"
Repository = "https://github.com/Sunzzx/biokin-gillespie-stochastic-gene-network"
Issues = "https://github.com/Sunzzx/biokin-gillespie-stochastic-gene-network/issues"

[project.scripts]
biokin-demo = "biokin.demo:main"

[tool.hatch.build.targets.wheel]
packages = ["src/biokin"]

[tool.hatch.build.targets.sdist]
include = ["src/biokin", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
